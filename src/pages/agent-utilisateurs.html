<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JetCongo | Gestion des utilisateurs</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200 min-h-screen">
    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden transition-opacity opacity-0">
    </div>

    <div class="flex min-h-screen relative">
        <!-- Sidebar (layout dashboard réutilisé) -->
        <aside id="agent-sidebar"
            class="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col fixed inset-y-0 left-0 z-50 transform -translate-x-full lg:translate-x-0 lg:static lg:block lg:min-h-screen transition-transform duration-300 ease-in-out">
            <div class="p-6 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">JetCongo</span>
                </div>
                <!-- Close button for mobile -->
                <button id="sidebar-close-btn"
                    class="lg:hidden text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-1">
                <a href="agent-dashboard.html"
                    class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                    <span class="material-icons text-xl">dashboard</span>
                    <span class="font-medium">Tableau de bord</span>
                </a>
                <a href="agent-flights.html"
                    class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                    <span class="material-icons text-xl">flight</span>
                    <span class="font-medium">Vols</span>
                </a>
                <a href="agent-avions.html"
                    class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                    <span class="material-icons text-xl">airplanemode_active</span>
                    <span class="font-medium">Flotte</span>
                </a>
                <a href="agent-utilisateurs.html"
                    class="flex items-center gap-3 px-3 py-2 bg-primary/10 text-primary rounded-lg">
                    <span class="material-icons text-xl">people</span>
                    <span class="font-medium">Utilisateurs</span>
                </a>
                <a href="agent-reservations.html"
                    class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                    <span class="material-icons text-xl">confirmation_number</span>
                    <span class="font-medium">Réservations</span>
                </a>
            </nav>
            <div class="p-4 border-t border-slate-200 dark:border-slate-800">
                <button id="agent-logout-btn"
                    class="flex items-center gap-3 px-4 py-3 w-full text-left text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-lg transition-colors">
                    <span class="material-icons text-xl">logout</span>
                    <span class="font-medium text-sm">Déconnexion</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-h-screen min-w-0">
            <!-- Top Header -->
            <header
                class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-4 lg:px-8 sticky top-0 z-30">
                <div class="flex items-center gap-3">
                    <!-- Hamburger Button (Mobile/Tablet) -->
                    <button id="sidebar-toggle-btn"
                        class="lg:hidden p-2 -ml-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                        <span class="material-icons">menu</span>
                    </button>
                    <h1 class="text-lg font-bold hidden md:block">Gestion des utilisateurs</h1>
                </div>
                <div class="flex items-center gap-4">
                    <button id="theme-toggle-btn" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
                        <span id="theme-toggle-icon" class="material-icons text-slate-500">dark_mode</span>
                    </button>
                    <button class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full relative">
                        <span class="material-icons">notifications</span>
                        <span
                            class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white dark:border-900"></span>
                    </button>
                    <button id="open-user-modal-btn"
                        class="bg-primary text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 hover:bg-blue-600 transition-colors">
                        <span class="material-icons text-sm">person_add</span>
                        Nouvel utilisateur
                    </button>
                </div>
            </header>

            <div class="flex-1 p-8 flex flex-col gap-6">
                <!-- Table Controls (adapté Stitch) -->
                <div
                    class="flex flex-col md:flex-row gap-4 justify-between items-center bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shrink-0">
                    <div class="relative w-full md:w-96">
                        <span
                            class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
                        <input id="user-search-input"
                            class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm"
                            placeholder="Rechercher par nom ou email..." type="text" />
                    </div>
                    <div class="flex items-center gap-3 w-full md:w-auto">
                        <select id="user-role-filter"
                            class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary/20">
                            <option value="">Tous les rôles</option>
                            <option value="admin">Admin</option>
                            <option value="agent">Agent</option>
                            <option value="client">Client</option>
                        </select>
                        <select id="user-status-filter"
                            class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary/20">
                            <option value="">Statut : Tous</option>
                            <option value="ACTIVE">Actif</option>
                            <option value="SUSPENDED">Suspendu</option>
                        </select>
                        <button id="user-export-btn"
                            class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-primary/90 transition-colors">
                            <span class="material-icons text-sm">file_download</span>
                            Exporter
                        </button>
                    </div>
                </div>

                <!-- User Table -->
                <div
                    class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden flex flex-col flex-1">
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50 dark:bg-slate-800/50">
                                <tr class="text-slate-500 text-xs font-semibold uppercase tracking-wider">
                                    <th class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">Utilisateur
                                    </th>
                                    <th class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">Rôle</th>
                                    <th class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">Statut</th>
                                    <th class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 text-right">
                                        Actions
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="user-table-body" class="divide-y divide-slate-100 dark:divide-slate-800">
                            </tbody>
                        </table>
                    </div>
                    <div
                        class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0 h-14">
                        <span id="user-table-count" class="text-sm text-slate-500">Aucun utilisateur</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Modal Utilisateur (création / modification, logique JS) -->
    <div id="user-modal"
        class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div
            class="bg-white dark:bg-slate-900 w-full max-w-md rounded-xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
            <div class="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
                <h3 id="user-modal-title" class="font-bold text-lg">Nouvel utilisateur</h3>
                <button id="user-modal-close"
                    class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <form id="user-form" class="p-6 space-y-4">
                <input type="hidden" id="user-id" />
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Nom complet</label>
                    <input id="user-name" required
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"
                        type="text" />
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
                    <input id="user-email" required
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"
                        type="email" />
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Rôle</label>
                    <select id="user-role"
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none">
                        <option value="client">Client</option>
                        <option value="agent">Agent</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Statut</label>
                    <select id="user-status"
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none">
                        <option value="">(non défini)</option>
                        <option value="ACTIVE">Actif</option>
                        <option value="SUSPENDED">Suspendu</option>
                    </select>
                </div>
            </form>
            <div class="p-6 bg-slate-50 dark:bg-slate-800/50 flex gap-3">
                <button id="user-modal-cancel"
                    class="flex-1 px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg font-medium hover:bg-white dark:hover:bg-slate-800 transition-colors text-sm">
                    Annuler
                </button>
                <button id="user-modal-save"
                    class="flex-1 px-4 py-2 bg-primary text-white rounded-lg font-medium hover:bg-blue-600 transition-colors text-sm">
                    Enregistrer
                </button>
            </div>
        </div>
    </div>

    <!-- Librairies d'export (Excel + PDF) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="../js/scripts.js"></script>
    <script src="../js/agent-utilisateurs.js"></script>
    <script src="../js/agent-logout.js"></script>
</body>

</html>
