<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JetCongo | Gestion de la flotte</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        display: ["Plus Jakarta Sans"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px",
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            zoom: 75%;
        }
    </style>
</head>

<body
    class="font-display bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200 min-h-screen">
    <div class="flex min-h-screen">
        <!-- Sidebar (layout réutilisé du dashboard) -->
        <aside
            class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col hidden lg:flex">
            <div class="p-6 flex items-center gap-3">
                <img src="../../public/images/logo-jetcongo.svg" alt="JetCongo"
                     class="w-10 h-10 object-contain" />
                <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">JetCongo</span>
            </div>
            <nav class="flex-1 px-4 space-y-1 mt-4">
                <a href="agent-dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all">
                    <span class="material-icons text-sm">dashboard</span>
                    <span class="font-medium text-sm">Tableau de bord</span>
                </a>
                <a href="agent-flights.html"
                    class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all">
                    <span class="material-icons text-sm">event_note</span>
                    <span class="font-medium text-sm">Vols</span>
                </a>
                <a href="agent-avions.html"
                    class="flex items-center gap-3 px-4 py-3 text-white bg-primary rounded-lg transition-all">
                    <span class="material-icons text-sm">airplanemode_active</span>
                    <span class="font-medium text-sm">Flotte</span>
                </a>
                <a href="agent-utilisateurs.html"
                    class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all">
                    <span class="material-icons text-sm">people</span>
                    <span class="font-medium text-sm">Utilisateurs</span>
                </a>
                <a href="agent-reservations.html"
                    class="flex items-center gap-3 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all">
                    <span class="material-icons text-sm">confirmation_number</span>
                    <span class="font-medium text-sm">Réservations</span>
                </a>
            </nav>
        </aside>

        <!-- Contenu principal : design Stitch adapté -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden p-8">
            <!-- Header -->
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Gestion de la flotte</h1>
                    <p class="text-slate-500 dark:text-slate-400">Suivi des avions actifs et de leur disponibilité.</p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="theme-toggle-btn"
                        class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
                        <span id="theme-toggle-icon" class="material-icons text-slate-500">dark_mode</span>
                    </button>
                    <button id="open-aircraft-modal-btn"
                    class="bg-primary hover:bg-primary/90 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 transition-all font-medium">
                    <span class="material-icons text-sm">add</span>
                    Ajouter un avion
                    </button>
                </div>
            </header>

            <!-- Toolbar -->
            <div
                class="flex flex-wrap items-center justify-between gap-4 mb-6 bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                <div class="flex items-center gap-4 flex-1 max-w-xl">
                    <div class="relative flex-1">
                        <span
                            class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">search</span>
                        <input id="aircraft-search-input"
                            class="w-full pl-10 pr-4 py-2 bg-background-light dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm"
                            placeholder="Rechercher par modèle ou compagnie..." type="text" />
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="aircraft-status-filter"
                            class="px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-medium bg-white dark:bg-slate-900">
                            <option value="all">Tous les statuts</option>
                            <option value="disponible">Disponible</option>
                            <option value="maintenance">Maintenance</option>
                            <option value="indisponible">Indisponible</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span id="aircraft-count-label" class="text-sm text-slate-500">Aucun avion</span>
                    <button id="aircraft-export-btn"
                            class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-primary/90 transition-colors">
                        <span class="material-icons text-sm">file_download</span>
                        Exporter
                    </button>
                </div>
            </div>

            <!-- Grille d'avions (remplie dynamiquement) -->
            <div id="aircraft-grid"
                class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            </div>

            <!-- Bandeau d'alerte style Stitch -->
            <div id="aircraft-alert"
                class="fixed bottom-6 right-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-2xl max-w-sm hidden">
                <div class="flex items-center gap-4 mb-4">
                    <div
                        class="w-10 h-10 bg-amber-100 dark:bg-amber-900/30 text-amber-600 rounded-full flex items-center justify-center">
                        <span class="material-icons">warning</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-900 dark:text-white text-sm">Alerte flotte</h4>
                        <p id="aircraft-alert-text" class="text-xs text-slate-500">Aucune alerte active.</p>
                    </div>
                </div>
                <button id="aircraft-alert-close"
                    class="w-full bg-slate-900 dark:bg-white dark:text-slate-900 text-white py-2 rounded-lg font-semibold text-sm hover:opacity-90 transition-opacity">
                    Fermer
                </button>
            </div>
        </main>
    </div>

    <!-- Panneau latéral d'édition / création (design Stitch simplifié) -->
    <div id="aircraft-panel"
        class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white dark:bg-slate-900 shadow-2xl border-l border-slate-200 dark:border-slate-800 z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <h2 id="aircraft-panel-title" class="text-xl font-bold">Ajouter un avion</h2>
            <button id="aircraft-panel-close"
                class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                <span class="material-icons">close</span>
            </button>
        </div>
        <form id="aircraft-form" class="p-6 space-y-5 overflow-y-auto flex-1">
            <input type="hidden" id="aircraft-id" />
            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Modèle</label>
                <input id="aircraft-modele" required
                    class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm"
                    placeholder="ex: Boeing 737-800" type="text" />
            </div>
            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Compagnie</label>
                <input id="aircraft-compagnie"
                    class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm"
                    placeholder="ex: JetCongo" type="text" />
            </div>
            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Capacité totale</label>
                <input id="aircraft-capacite" required min="1"
                    class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm"
                    type="number" />
            </div>
            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Statut opérationnel</label>
                <select id="aircraft-statut"
                    class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm">
                    <option value="disponible">Disponible</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="indisponible">Indisponible</option>
                </select>
            </div>
        </form>
        <div class="p-6 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
            <div class="flex gap-3">
                <button id="aircraft-panel-cancel"
                    class="flex-1 px-4 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg font-semibold text-sm hover:bg-white dark:hover:bg-slate-800">
                    Annuler
                </button>
                <button id="aircraft-panel-save"
                    class="flex-1 px-4 py-2.5 bg-primary text-white rounded-lg font-semibold text-sm hover:bg-primary/90">
                    Enregistrer
                </button>
            </div>
        </div>
    </div>

    <!-- Librairies d'export (Excel + PDF) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="../js/scripts.js"></script>
    <script src="../js/agent-avions.js"></script>
</body>

</html>
