<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>JetCongo - Vols</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts & Styles globaux JetCongo -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Bootstrap (CDN) pour la mise en page / composants -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>

<body>
    <!-- Header placeholder (chargé via scripts.js comme sur la home) -->
    <div id="header-container"></div>

    <main class="py-4" style="background-color:#f5f7fb;">
        <div class="container-fluid">
            <div class="row">
                <!-- Colonne filtre / recherche -->
                <div class="col-lg-3 mb-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Affiner votre recherche</h5>
                            <form id="volsFilterForm" class="vols-filter-form">
                                <div class="mb-3">
                                    <label class="form-label">Ville de départ</label>
                                    <select id="departure-city" class="form-select">
                                        <option value="">Sélectionner...</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Ville d'arrivée</label>
                                    <select id="arrival-city" class="form-select">
                                        <option value="">Sélectionner...</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Date de départ</label>
                                    <input type="date" id="vol-date" class="form-control">
                                </div>

                                <button id="btn-search-vols" class="btn btn-primary w-100">
                                    Rechercher
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Colonne résultats -->
                <div class="col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h3 class="mb-0">Vols disponibles</h3>
                            <small class="text-muted" id="volsSubtitle"></small>
                        </div>
                        <!-- Placeholder éventuel pour tri (non fonctionnel ici, mais classe bootstrap conservée) -->
                        <div class="d-none d-md-block">
                            <button class="btn btn-outline-secondary btn-sm" type="button" disabled>
                                Trier par (coming soon)
                            </button>
                        </div>
                    </div>

                    <!-- Zone d'erreur / info -->
                    <div id="volsError" class="alert alert-danger d-none" role="alert"></div>

      

                    <!-- Conteneur des cartes de vols -->
                    <div id="volsContainer"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer placeholder -->
    <div id="footer-container"></div>

    <!-- Scripts Bootstrap + JS globaux + logique vols -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <script src="../js/scripts.js"></script>
    <script src="../js/vols.js"></script>
</body>

</html>
